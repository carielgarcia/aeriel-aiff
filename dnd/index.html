<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Machiavell: player guide</title>
<meta name="description" content="An interactive guide to Machiavell, a Wood Elf Bard of the College of Lore: track slots and HP, roll with the right bonuses, and learn what every spell does.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0B1D1A">
<meta property="og:type" content="website">
<meta property="og:site_name" content="ÆRIEL">
<meta property="og:title" content="Machiavell: player guide">
<meta property="og:description" content="Interactive D&D guide for a Wood Elf Bard: spells, slots, dice and a first-turn walkthrough.">
<meta property="og:url" content="https://aeriel.net/dnd">
<link rel="canonical" href="https://aeriel.net/dnd">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%230B1D1A'/><text y='72' x='50' font-size='64' text-anchor='middle' fill='%23EEE7D3' font-family='Georgia,serif' font-style='italic'>M</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Newsreader:ital,opsz,wght@0,6..72,400..700;1,6..72,400..700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0B1D1A; --panel:#12302A; --panel2:#194039; --ink:#EEE7D3; --dim:#B2AB94; --line:rgba(238,231,211,.15);
  --sage:#8CC2A8; --violet:#AB9CF4; --brass:#D8AC4F; --ledger:#EE7B64; --focus:#F6DC8E;
  --serif:'Newsreader',Georgia,'Times New Roman',serif;
  --sans:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --nav-h:62px;
}
*{box-sizing:border-box}
html{color-scheme:dark;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.5;
  padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 24px)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
h1,h2,h3{font-family:var(--serif);font-weight:600;line-height:1.15;margin:0}
p{margin:0 0 .7em;max-width:66ch}
.wrap{max-width:860px;margin:0 auto;padding:0 16px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- status header ---------- */
.status{padding:12px 0 14px}
.mini{position:fixed;top:0;left:0;right:0;z-index:40;background:var(--panel);border-bottom:1px solid var(--line);display:none;padding-top:env(safe-area-inset-top)}
.mini.on{display:block}
.mini button{display:flex;width:100%;max-width:860px;margin:0 auto;background:none;border:0;padding:8px 16px;gap:16px;align-items:center;justify-content:space-between;min-height:46px;text-align:left}
.mini b{font-family:var(--serif);font-size:20px;white-space:nowrap}
.mini span{font-size:14px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.id-row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.name{font-size:30px;font-style:italic;letter-spacing:.2px}
.sub{color:var(--dim);font-size:14px;margin-top:2px}
.hpbtn{background:var(--panel);border:1px solid var(--line);border-radius:3px 12px 3px 12px;padding:6px 14px 8px;text-align:right;min-width:128px}
.hpbtn .lbl{display:block;font-size:12px;color:var(--dim)}
.hpbtn .num{font-family:var(--serif);font-size:30px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.hpbtn .num small{font-size:16px;color:var(--dim);font-weight:400}
.hpbar{height:4px;background:rgba(238,231,211,.12);margin-top:6px;border-radius:2px;overflow:hidden}
.hpbar i{display:block;height:100%;background:var(--sage)}
.hpbar.low i{background:var(--ledger)}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:3px;margin-top:10px;overflow:hidden}
.stats div{background:var(--bg);padding:5px 6px}
.stats b{display:block;font-family:var(--serif);font-size:20px;line-height:1.1}
.stats span{font-size:12px;color:var(--dim)}
.res{display:flex;flex-wrap:wrap;gap:2px 16px;margin-top:10px;align-items:center}
.pool{display:flex;align-items:center;gap:6px}
.pool .t{font-size:13px;color:var(--dim);margin-right:2px}
.pip{width:26px;height:26px;border-radius:50%;border:2px solid currentColor;background:currentColor;padding:0;position:relative}
.pip.off{background:transparent;border-style:dashed;opacity:.5}
.pip[data-c=slot]{color:var(--ink)} .pip[data-c=bi]{color:var(--brass)} .pip[data-c=free]{color:var(--violet)}
.pip::after{content:"";position:absolute;inset:-9px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{border-radius:999px;border:1px solid var(--line);background:var(--panel);padding:2px 12px;font-size:14px;display:inline-flex;gap:8px;align-items:center}
.chip.conc{border-color:var(--violet);color:var(--violet)}
.chip.warn{border-color:var(--ledger);color:var(--ledger)}
.chip button{background:none;border:0;padding:0 2px;text-decoration:underline;font-size:13px}

/* ---------- nav ---------- */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--panel);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{background:none;border:0;height:var(--nav-h);font-size:14px;color:var(--dim);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:2px;border-top:3px solid transparent}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current=page]{color:var(--ink);border-top-color:var(--ink)}
@media(min-width:760px){
  nav.tabs{position:static;bottom:auto;grid-template-columns:repeat(5,auto);justify-content:start;gap:4px;background:none;border:0;padding:0}
  nav.tabs button{flex-direction:row;gap:8px;height:46px;padding:0 18px;border-top:0;border-bottom:3px solid transparent;font-size:16px}
  nav.tabs button[aria-current=page]{border-bottom-color:var(--ink)}
  body{padding-bottom:40px}
  .navbar{border-bottom:1px solid var(--line);margin-bottom:18px}
}
.navbar{}

/* ---------- generic ---------- */
main{padding-top:6px}
.sect{margin:26px 0 12px}
.sect h2{font-size:26px}
.sect p.lead{color:var(--dim);margin:6px 0 0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:3px 12px 3px 12px;padding:14px 16px;margin:10px 0}
.btn{background:var(--ink);color:var(--bg);border:0;border-radius:999px;padding:10px 20px;font-weight:700;min-height:44px}
.btn.alt{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.btn.sm{padding:6px 14px;min-height:36px;font-size:15px}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.danger{background:var(--ledger);color:#2a0d07}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{background:none;border:0;padding:8px 16px;min-height:40px;color:var(--dim)}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg);font-weight:700}
.muted{color:var(--dim)}
.tag{display:inline-block;border-radius:999px;font-size:13px;padding:1px 10px;border:1px solid currentColor;white-space:nowrap}
.tag.none{color:var(--sage)} .tag.free{color:var(--violet)} .tag.bi{color:var(--brass)} .tag.slot{color:var(--ink)}

/* ---------- turn bar (the signature) ---------- */
.bar{display:grid;grid-template-columns:1.1fr 1fr 1fr 1fr;border:2px solid var(--ink);border-radius:2px;margin:12px 0 6px;background:var(--bg)}
.beat{background:none;border:0;border-right:2px solid var(--ink);padding:12px 8px 10px;text-align:left;position:relative;min-height:84px;display:flex;flex-direction:column;justify-content:space-between}
.beat:last-child{border-right:0}
.beat b{font-family:var(--serif);font-size:20px;line-height:1.1;font-weight:600}
.beat small{font-size:13px;color:var(--dim);display:block;margin-top:2px}
.beat .st{font-size:13px;font-weight:700;color:var(--sage)}
.beat[aria-pressed=true]{background:repeating-linear-gradient(135deg,transparent 0 7px,rgba(238,231,211,.13) 7px 9px);color:var(--dim)}
.beat[aria-pressed=true] b{text-decoration:line-through;text-decoration-thickness:2px}
.beat[aria-pressed=true] .st{color:var(--dim)}
.barnote{font-size:14px;color:var(--dim);margin:0 0 10px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.switch{display:flex;align-items:center;gap:10px}
.switch button{width:46px;height:28px;border-radius:999px;border:2px solid var(--ink);background:transparent;position:relative;padding:0}
.switch button::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--ink);transition:transform .15s}
.switch button[aria-pressed=true]{background:var(--ink)}
.switch button[aria-pressed=true]::after{transform:translateX(18px);background:var(--bg)}

/* ---------- intents ---------- */
.intents{display:flex;flex-wrap:wrap;gap:8px}
.intents button{background:var(--panel);border:1.5px solid var(--line);border-radius:999px;padding:9px 16px;min-height:44px}
.intents button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:700}
.sug{display:flex;gap:12px;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding:10px 0}
.sug:first-child{border-top:0}
.sug .tx b{font-family:var(--serif);font-size:19px;font-weight:600}
.sug .tx p{margin:2px 0 0;color:var(--dim);font-size:15px}

/* ---------- power cards ---------- */
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:14px;color:var(--dim);margin:8px 0 4px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.card{background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--ink);border-radius:3px 10px 10px 3px;margin:10px 0;overflow:hidden}
.card[data-k=none]{border-left-color:var(--sage)} .card[data-k=free]{border-left-color:var(--violet)} .card[data-k=bi]{border-left-color:var(--brass)} .card[data-k=slot]{border-left-color:var(--ink)}
.card .top{display:flex;gap:12px;justify-content:space-between;align-items:flex-start;padding:14px 16px 8px}
.card h3{font-size:23px}
.card .one{margin:4px 0 0;color:var(--ink);font-size:16px}
.facts{display:grid;grid-template-columns:repeat(4,auto);justify-content:start;gap:4px 22px;padding:0 16px 10px;margin:0}
.facts div{min-width:0}
.facts dt{font-size:12px;color:var(--dim)}
.facts dd{margin:0;font-size:15px;font-weight:700}
@media(max-width:520px){.facts{grid-template-columns:repeat(2,1fr)}}
.card details{border-top:1px solid var(--line)}
.card summary{padding:10px 16px;cursor:pointer;color:var(--dim);list-style:none;min-height:44px;display:flex;align-items:center}
.card summary::-webkit-details-marker{display:none}
.card summary::before{content:"+";font-family:var(--serif);font-size:22px;width:22px;color:var(--ink)}
.card details[open] summary::before{content:"\2212"}
.card .body{padding:2px 16px 14px}
.card .body h4{font-family:var(--serif);font-size:17px;margin:12px 0 4px;font-weight:600}
.card .body ul{margin:0;padding-left:20px}
.card .body li{margin:3px 0;max-width:64ch}
.card.blocked{opacity:.78}
.note-s{font-size:14px;color:var(--ledger);margin-top:4px}

/* ---------- rolls ---------- */
.result{background:var(--panel2);border:2px solid var(--ink);border-radius:3px 14px 3px 14px;padding:14px 18px;margin:12px 0;min-height:110px}
.result .big{font-family:var(--serif);font-size:56px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.result .why{color:var(--dim);margin:2px 0 0}
.result.crit{border-color:var(--sage)} .result.fumble{border-color:var(--ledger)}
.result .badge{font-weight:700;margin-left:10px;font-size:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(max-width:520px){.grid2{grid-template-columns:1fr}}
.rbtn{display:flex;align-items:center;justify-content:space-between;gap:10px;text-align:left;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:3px 10px 3px 10px;padding:9px 14px;min-height:54px}
.rbtn:hover{background:var(--panel2)}
.rbtn .l b{display:block;font-weight:700}
.rbtn .l span{font-size:13px;color:var(--dim);display:block}
.rbtn .m{font-family:var(--serif);font-size:24px;font-weight:600;font-variant-numeric:tabular-nums}
.rbtn.star{border-color:var(--ink)}
.dice{display:flex;flex-wrap:wrap;gap:8px}
.dice button{background:var(--panel);border:1px solid var(--line);border-radius:3px 10px 3px 10px;min-width:62px;min-height:48px;font-weight:700}
.log{margin:6px 0 0;padding:0;list-style:none}
.log li{display:flex;justify-content:space-between;gap:12px;border-top:1px solid var(--line);padding:6px 0;font-size:15px}
.log li span:last-child{font-family:var(--serif);font-size:20px;font-weight:600}

/* ---------- learn ---------- */
details.lesson{background:var(--panel);border:1px solid var(--line);border-radius:3px 12px 3px 12px;margin:10px 0}
details.lesson>summary{padding:14px 16px;cursor:pointer;font-family:var(--serif);font-size:21px;font-weight:600;list-style:none;min-height:48px;display:flex;gap:10px;align-items:center}
details.lesson>summary::-webkit-details-marker{display:none}
details.lesson>summary::before{content:"+";width:20px;font-size:24px}
details.lesson[open]>summary::before{content:"\2212"}
details.lesson .in{padding:0 16px 14px}
ol.steps{margin:0;padding:0;list-style:none;counter-reset:s}
ol.steps li{counter-increment:s;display:grid;grid-template-columns:34px 1fr;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
ol.steps li:first-child{border-top:0}
ol.steps li::before{content:counter(s);font-family:var(--serif);font-size:26px;font-weight:600;color:var(--brass);line-height:1}
ol.steps b{font-family:var(--serif);font-size:18px}
ol.steps p{margin:2px 0 0;color:var(--dim)}
table.tbl{width:100%;border-collapse:collapse;font-size:16px}
table.tbl th,table.tbl td{text-align:left;padding:8px 10px 8px 0;border-top:1px solid var(--line);vertical-align:top}
table.tbl th{font-weight:700;color:var(--dim);font-size:14px;border-top:0}
.gl{width:100%;background:var(--bg);border:1.5px solid var(--line);color:var(--ink);border-radius:999px;padding:10px 18px;min-height:46px;font:inherit}
.gloss dt{font-family:var(--serif);font-size:19px;font-weight:600;margin-top:12px}
.gloss dd{margin:2px 0 0;color:var(--dim);max-width:66ch}
.hello{border:2px solid var(--brass);background:var(--panel);border-radius:3px 14px 3px 14px;padding:14px 16px;margin:12px 0}
.hello h2{font-size:22px;margin-bottom:4px}

/* ---------- dialogs & toast ---------- */
dialog{background:var(--panel);color:var(--ink);border:1.5px solid var(--ink);border-radius:14px 14px 3px 3px;padding:0;width:min(560px,100vw);max-height:92vh;margin:auto auto 0}
@media(min-width:760px){dialog{margin:auto;border-radius:3px 16px 3px 16px}}
dialog::backdrop{background:rgba(3,10,9,.72)}
.dlg{padding:18px 18px 16px}
.dlg h2{font-size:26px;margin-bottom:6px}
.opt{display:flex;gap:12px;align-items:flex-start;border:1.5px solid var(--line);border-radius:3px 10px 3px 10px;padding:10px 12px;margin:8px 0;cursor:pointer}
.opt input{margin-top:5px;width:20px;height:20px;accent-color:#EEE7D3}
.opt.dis{opacity:.45;cursor:not-allowed}
.opt:has(input:checked){border-color:var(--ink);background:var(--panel2)}
.opt b{display:block} .opt span{font-size:14px;color:var(--dim)}
.alert{border-left:4px solid var(--ledger);background:rgba(238,123,100,.1);padding:8px 12px;margin:10px 0;font-size:15px;border-radius:0 6px 6px 0}
.alert.info{border-left-color:var(--violet);background:rgba(171,156,244,.1)}
.dlg .acts{display:flex;gap:10px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.dlg input[type=number],.dlg input[type=text],textarea{width:100%;background:var(--bg);color:var(--ink);border:1.5px solid var(--line);border-radius:8px;padding:10px 12px;font:inherit;min-height:46px}
textarea{min-height:130px}
.steps-s{margin:6px 0 0;padding-left:20px}
.steps-s li{margin:4px 0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 14px);z-index:60;background:var(--ink);color:var(--bg);
  border-radius:12px 3px 12px 3px;padding:10px 18px;max-width:92vw;font-weight:700;box-shadow:0 8px 28px rgba(0,0,0,.5);display:none}
.toast.on{display:block}
@media(min-width:760px){.toast{bottom:24px}}
.death{display:flex;gap:18px;flex-wrap:wrap;margin:8px 0}
.death .pool .pip{color:var(--sage)} .death .f .pip{color:var(--ledger)}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<header class="status" aria-label="Machiavell status">
  <div class="wrap">
    <div class="id-row">
      <div>
        <h1 class="name">Machiavell</h1>
        <div class="sub">Wood Elf Bard, College of Lore, level 3</div>
      </div>
      <button class="hpbtn" id="hpbtn" data-a="hp" aria-label="Open hit points"></button>
    </div>
    <div class="stats" id="stats"></div>
    <div class="res" id="res"></div>
    <div class="chips" id="chips"></div>
  </div>
</header>

<div class="mini" id="mini"><button data-a="hp" aria-label="Open hit points"></button></div>
<div class="navbar"><div class="wrap">
<nav class="tabs" id="tabs" aria-label="Sections"></nav>
</div></div>

<main class="wrap" id="main" tabindex="-1"></main>

<dialog id="dlg" aria-labelledby="dlgt"></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
'use strict';

/* =========================================================
   DATA: everything below comes from the character sheet
   ========================================================= */
var PB = 2;
var ABIL = {str:-1, dex:2, con:2, int:1, wis:0, cha:3};
var DC = 13, ATK = 5, INIT = 3, AC = 13, SPEED = 35;
var MAXHP = 24, HITDICE = 3;

var SKILLS = [
 {id:'acrobatics', n:'Acrobatics', a:'dex', p:'jat', d:'Keep your balance, tumble, escape a grapple by wriggling.'},
 {id:'animal', n:'Animal Handling', a:'wis', p:'jat', d:'Calm or read an animal.'},
 {id:'arcana', n:'Arcana', a:'int', p:'exp', d:'Know about magic, wards, spells and magical creatures.'},
 {id:'athletics', n:'Athletics', a:'str', p:'jat', d:'Climb, jump, swim, shove.'},
 {id:'deception', n:'Deception', a:'cha', p:'pro', d:'Lie convincingly, bluff, disguise your intent.'},
 {id:'history', n:'History', a:'int', p:'pro', d:'Recall facts about people, places and events.'},
 {id:'insight', n:'Insight', a:'wis', p:'pro', d:'Tell whether someone is lying or what they want.'},
 {id:'intimidation', n:'Intimidation', a:'cha', p:'jat', d:'Pressure someone with threats or presence.'},
 {id:'investigation', n:'Investigation', a:'int', p:'jat', d:'Search for clues, find hidden things by reasoning.'},
 {id:'medicine', n:'Medicine', a:'wis', p:'jat', d:'Stabilize a dying creature, diagnose an illness.'},
 {id:'nature', n:'Nature', a:'int', p:'jat', d:'Know plants, animals, weather and terrain.'},
 {id:'perception', n:'Perception', a:'wis', p:'pro', d:'Notice things with your senses: guards, traps, sounds.'},
 {id:'performance', n:'Performance', a:'cha', p:'pro', d:'Sing, play, act, entertain a crowd.'},
 {id:'persuasion', n:'Persuasion', a:'cha', p:'exp', d:'Convince someone honestly or politely. Your best skill.'},
 {id:'religion', n:'Religion', a:'int', p:'jat', d:'Know gods, rites and holy symbols.'},
 {id:'sleight', n:'Sleight of Hand', a:'dex', p:'pro', d:'Pick a pocket, palm an object, plant something.'},
 {id:'stealth', n:'Stealth', a:'dex', p:'pro', d:'Move quietly, stay hidden.'},
 {id:'survival', n:'Survival', a:'wis', p:'jat', d:'Track, forage, find your way.'}
];
var SAVES = [
 {id:'str', n:'Strength', p:false},{id:'dex', n:'Dexterity', p:true},{id:'con', n:'Constitution', p:false},
 {id:'int', n:'Intelligence', p:false},{id:'wis', n:'Wisdom', p:false},{id:'cha', n:'Charisma', p:true}
];
var SAVE_NOTE = {str:'Resist being pushed or crushed.',dex:'Dodge a fireball, a trap or a falling rock.',con:'Hold concentration, resist poison and exhaustion.',
  int:'Resist some mind-bending magic.',wis:'Resist being charmed, frightened or controlled.',cha:'Resist being banished or possessed.'};

function skillBonus(s){
  var m = ABIL[s.a];
  if(s.p==='exp') return m + 2*PB;
  if(s.p==='pro') return m + PB;
  return m + Math.floor(PB/2);
}
function saveBonus(s){ return ABIL[s.id] + (s.p?PB:0); }
function skillById(id){ for(var i=0;i<SKILLS.length;i++) if(SKILLS[i].id===id) return SKILLS[i]; }

/* =========================================================
   DICE
   ========================================================= */
function rnd(n){
  if(window.crypto && crypto.getRandomValues){
    var a = new Uint32Array(1), lim = Math.floor(4294967296/n)*n, x;
    do{ crypto.getRandomValues(a); x=a[0]; }while(x>=lim);
    return (x % n) + 1;
  }
  return Math.floor(Math.random()*n)+1;
}
function rollExpr(expr){
  var m = /^(\d+)d(\d+)([+-]\d+)?$/.exec(expr);
  if(!m) return null;
  var c = +m[1], d = +m[2], bonus = m[3]? +m[3] : 0, parts = [], sum = 0;
  for(var i=0;i<c;i++){ var r=rnd(d); parts.push(r); sum+=r; }
  return {parts:parts, bonus:bonus, total:sum+bonus, expr:expr};
}
function d20(adv){
  var a = rnd(20);
  if(adv==='n') return {all:[a], used:a};
  var b = rnd(20);
  return {all:[a,b], used: adv==='a'? Math.max(a,b) : Math.min(a,b)};
}
function pushLog(label, text, total){
  S.rolls.unshift({l:label, t:text, v:total});
  if(S.rolls.length>14) S.rolls.length=14;
}

function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
var toastT;
function toast(msg){
  var t=$('toast'); t.textContent=msg; t.classList.add('on');
  clearTimeout(toastT); toastT=setTimeout(function(){t.classList.remove('on');},4200);
}
function tagFor(sp){
  if(sp.kind==='none') return '<span class="tag none">'+(sp.isFeature?'Unlimited':'Unlimited cantrip')+'</span>';
  if(sp.kind==='free') return '<span class="tag free">Free once per Long Rest</span>';
  if(sp.kind==='bi') return '<span class="tag bi">Uses Bardic Inspiration</span>';
  return '<span class="tag slot">'+(sp.lvl===1?'1st-level slot':'2nd-level slot')+(sp.ritual?', or ritual':'')+'</span>';
}

  $('stats').innerHTML = [['Armor',AC],['Speed',SPEED+' ft'],['Spell DC',DC],['Spell attack',fm(ATK)],['Initiative',fm(INIT)]]
    .map(function(x){return '<div><b>'+x[1]+'</b><span>'+x[0]+'</span></div>';}).join('');
  function pool(label,cat,key,n,max){
    var h='<div class="pool"><span class="t">'+label+'</span>';
    for(var i=0;i<max;i++){
      var on = i<n;
      h+='<button class="pip'+(on?'':' off')+'" data-c="'+cat+'" data-a="pip" data-k="'+key+'" data-i="'+i+'" aria-pressed="'+on+'" aria-label="'+label+' '+(i+1)+': '+(on?'available, tap to mark spent':'spent, tap to restore')+'"></button>';
    }
    return h+'</div>';
  }
  $('res').innerHTML = pool('1st slots','slot','s1',S.slots[1],4)+pool('2nd slots','slot','s2',S.slots[2],2)+
    pool('Inspiration','bi','bi',S.bi,3)+
    pool('Longstrider','free','f:longstrider',S.free.longstrider?1:0,1)+pool('Disguise Self','free','f:disguiseSelf',S.free.disguiseSelf?1:0,1);
  var ch='';
  if(S.conc) ch+='<span class="chip conc">Concentrating on '+esc(P[S.conc].n)+' <button data-a="endconc">End it</button></span>';
  if(S.silenced) ch+='<span class="chip warn">You are inside a Silence zone <button data-a="silence">Leave</button></span>';
  if(S.hp===0) ch+='<span class="chip warn">You are at 0 HP</span>';
  $('chips').innerHTML = ch;
}

function skillBtn(s){
  var mark = s.p==='exp'?'Expertise':s.p==='pro'?'Proficient':'Half bonus';

function logHtml(){

function resultHtml(){
  if(!lastRoll) return '<div class="result"><div class="why">Your roll shows here. A 20 is a critical success and a 1 is a critical failure.</div></div>';
  var r=lastRoll;
  var cls = r.crit==='20'?' crit': r.crit==='1'?' fumble':'';
  var badge = r.crit==='20'?'<span class="badge" style="color:var(--sage)">Natural 20</span>': r.crit==='1'?'<span class="badge" style="color:var(--ledger)">Natural 1</span>':'';
  var h='<div class="result'+cls+'" aria-live="polite"><div class="why"><b style="color:var(--ink)">'+esc(r.label)+'</b>'+badge+'</div><div class="big">'+r.total+'</div><div class="why">'+esc(r.detail)+'</div>';
  if(r.follow) h+='<div style="margin-top:10px">'+r.follow+'</div>';
  return h+'</div>';
}
function showRoll(r){
  lastRoll=r; pushLog(r.label, r.detail, r.total); save();
  if(S.tab==='roll'){ $('lastroll').innerHTML=resultHtml(); $('log').innerHTML=logHtml(); }
  else toast(r.label+': '+r.total);
}
function doCheck(label, mod, extraNote){
  var d=d20(S.adv);
  var detail = (S.adv==='n'?'d20 '+d.used:(S.adv==='a'?'Advantage: ':'Disadvantage: ')+d.all.join(' and ')+' (kept '+d.used+')')+' '+fm(mod)+' = '+(d.used+mod);
  showRoll({label:label,total:d.used+mod,detail:detail+(extraNote?'. '+extraNote:''),crit:d.used===20?'20':d.used===1?'1':null});
}
function doAttack(k){
  var w=WEAPONS[k], d=d20(S.adv);
  var total=d.used+w.hit;
  var crit=d.used===20, fumble=d.used===1;
  var detail=(S.adv==='n'?'d20 '+d.used:(S.adv==='a'?'Advantage: ':'Disadvantage: ')+d.all.join(' and ')+' (kept '+d.used+')')+' '+fm(w.hit)+' = '+total+'. The DM compares this to the target’s Armor Class.';
  var follow = fumble? '' : '<button class="btn sm" data-a="dmg" data-v="'+k+'" data-c="'+(crit?1:0)+'">Roll damage'+(crit?' (critical: dice doubled)':'')+'</button>';
  showRoll({label:w.n+' attack',total:total,detail:detail,crit:crit?'20':fumble?'1':null,follow:follow});
}
function doDamage(k,crit){
  var w=WEAPONS[k], m=/^(\d+)d(\d+)$/.exec(w.dmg), n=(+m[1])*(crit?2:1);
  var r=rollExpr(n+'d'+m[2]+'+'+w.add);
  showRoll({label:w.n+' damage',total:r.total,detail:r.parts.join(' + ')+' '+fm(w.add)+' = '+r.total+' '+w.note+(crit?' (critical hit)':''),crit:null});
}

var GLOSS = [
 ['Action','The main thing you do on your turn: attack, cast a spell, dash, hide, and so on. You get one per turn.'],

 ['Cantrip','A spell you can cast as often as you like, with no spell slot.'],

 ['Concentration','Some spells stay active only while you focus on them. You can focus on one at a time. Casting another concentration spell, being knocked out, or failing a Constitution save after taking damage ends it.'],
 ['Critical hit','An attack roll of a natural 20 always hits. Roll the damage dice twice and add your bonus once.'],
 ['DC (Difficulty Class)','The number a roll must meet or beat. Your Spell Save DC is 13: enemies must roll 13 or more on their save to resist your spell.'],
 ['Deafened','You cannot hear, and you fail any check that depends on hearing.'],
 ['Expertise','You double your proficiency bonus for a skill. You have it in Arcana and Persuasion.'],
 ['Hit Dice','Dice you can spend during a Short Rest to heal. You have three d8s, and each heals the roll plus your Constitution modifier (+2).'],
 ['Incapacitated','You cannot take Actions, Bonus Actions or Reactions, and your Concentration ends.'],
 ['Invisible','Nobody can see you unless they have a special sense. Attacks against you are harder and yours are easier, as long as they cannot see you.'],
 ['Long Rest','At least 8 hours of rest (4 for you, thanks to Trance). You regain all hit points, all spell slots, Bardic Inspiration and free casts, and half your Hit Dice.'],
 ['Opportunity attack','When an enemy you can see leaves your reach, you can use your Reaction to make one melee attack against it.'],
 ['Proficiency bonus','A number added to rolls you are trained in. Yours is +2.'],
 ['Reaction','One special move you can make on anyone’s turn, such as Cutting Words. It resets when your own turn starts.'],

function glossHtml(q){

  return list.map(function(g){return '<dt>'+g[0]+'</dt><dd>'+g[1]+'</dd>';}).join('');
}

     '<div class="panel"><div class="row" style="justify-content:space-between"><div><b style="font-family:var(--serif);font-size:34px">'+S.days+'</b> <span class="muted">days left</span></div>'+
     '<div class="row"><button class="btn sm alt" data-a="days" data-v="-1" aria-label="One day less">− 1 day</button><button class="btn sm alt" data-a="days" data-v="1" aria-label="One day more">+ 1 day</button></div></div></div>';
  h+='<div class="sect"><h2>Gear</h2></div><div class="panel"><ul style="margin:0;padding-left:20px"><li>Leather armor under a midnight-green velvet frock coat</li><li>Two daggers, one in the boot and one in the waistcoat</li><li>Collapsible light crossbow with 20 bolts</li><li>Viol, your spellcasting focus</li><li>Calligrapher’s Supplies, parchment and a book on the history of wards</li><li>Orsolo’s letters in the document case</li></ul></div>';
  h+='<div class="sect"><h2>Session notes</h2></div><label class="sr" for="notes">Notes</label><textarea id="notes" placeholder="Names, clues, what the DM said. Saved on this device.">'+esc(S.notes)+'</textarea>';
  h+='<div class="sect"><h2>Reset</h2></div><button class="btn alt" data-a="reset">Reset everything on this device</button>';
  return h;
}

/* =========================================================
   VIEW SWITCH
   ========================================================= */
function render(keepScroll){
  var y = window.scrollY;
  renderHeader(); renderTabs();
  var v = S.tab==='turn'?viewTurn():S.tab==='powers'?viewPowers():S.tab==='roll'?viewRoll():S.tab==='learn'?viewLearn():viewMe();
  var openIds = [];
  if(keepScroll){ var ds=document.querySelectorAll('#main details[open]'); for(var i=0;i<ds.length;i++){ var s=ds[i].querySelector('summary'); if(s) openIds.push(s.textContent+'|'+(ds[i].parentNode.querySelector('h3')||{}).textContent); } }
  $('main').innerHTML = v;
  if(keepScroll){
    var ds2=document.querySelectorAll('#main details');
    for(var j=0;j<ds2.length;j++){ var s2=ds2[j].querySelector('summary'); var key=s2?(s2.textContent+'|'+(ds2[j].parentNode.querySelector('h3')||{}).textContent):''; if(openIds.indexOf(key)>-1) ds2[j].open=true; }
    window.scrollTo(0,y);
  }
}
function go(tab){ S.tab=tab; save(); render(false); window.scrollTo(0,0); }

/* =========================================================
   HP DIALOG
   ========================================================= */
var dlg = $('dlg');
function openDialog(html){ dlg.innerHTML=html; if(!dlg.open) dlg.showModal(); }
function closeDialog(){ if(dlg.open) dlg.close(); }
function openHP(){
  var h='<div class="dlg"><h2 id="dlgt">Hit points</h2><p class="muted">Now '+S.hp+' of '+MAXHP+(S.temp?', plus '+S.temp+' temporary':'')+'. Type a number, then choose what it is.</p>'+
   '<label class="sr" for="hpn">Amount</label><input id="hpn" type="number" min="0" inputmode="numeric" placeholder="Amount">'+
   '<div class="acts" style="justify-content:flex-start"><button class="btn danger" data-a="hpapply" data-v="damage">Damage</button><button class="btn" data-a="hpapply" data-v="heal">Heal</button><button class="btn alt" data-a="hpapply" data-v="temp">Temp HP</button></div>';
  if(S.hp===0){
    h+='<h3 style="margin-top:16px;font-size:20px">Death saving throws</h3><p class="muted">Roll one at the start of each of your turns. 10 or more is a success.</p>'+
      '<div class="death"><div class="pool"><span class="t">Successes</span>'+[0,1,2].map(function(i){return '<span class="pip'+(i<S.death.s?'':' off')+'" style="display:inline-block"></span>';}).join('')+'</div>'+
      '<div class="pool f"><span class="t">Failures</span>'+[0,1,2].map(function(i){return '<span class="pip'+(i<S.death.f?'':' off')+'" style="display:inline-block"></span>';}).join('')+'</div></div>'+
      '<div class="row"><button class="btn sm" data-a="deathroll">Roll death save</button><button class="btn sm alt" data-a="deathfail">Add a failure (hit at 0 HP)</button></div>';
  }
  h+='<div class="acts"><button class="btn alt" data-a="close">Close</button></div></div>';
  openDialog(h);
}
function applyHP(kind){
  var n = parseInt(($('hpn')||{}).value,10);
  if(!(n>0)){ toast('Type an amount first.'); return; }
  if(kind==='damage'){
    var wasConc=S.conc, absorbed=Math.min(S.temp,n); S.temp-=absorbed; var rest=n-absorbed;
    var before=S.hp; S.hp=Math.max(0,S.hp-rest);
    if(before===0 && rest>0){ S.death.f=Math.min(3,S.death.f+1); }
    save(); closeDialog(); render(true);
    var msg = 'Took '+n+' damage. '+S.hp+' hit points left.';
    if(S.hp===0 && before>0) { msg+=' You fall unconscious.'; S.death={s:0,f:0}; save(); }
    if(wasConc && rest>0 && S.hp>0){ concCheck(Math.max(10,Math.floor(rest/2))); }
    else { toast(msg); if(S.hp===0 && wasConc){ S.conc=null; save(); render(true);} }
  } else if(kind==='heal'){
    var was=S.hp; S.hp=Math.min(MAXHP,S.hp+n); if(was===0){ S.death={s:0,f:0}; }
    save(); closeDialog(); render(true); toast('Healed. '+S.hp+' hit points.');
  } else {
    S.temp=Math.max(S.temp,n); save(); closeDialog(); render(true); toast('Temporary hit points: '+S.temp+'.');
  }
}
function concCheck(dc){
  openDialog('<div class="dlg"><h2 id="dlgt">Concentration check</h2><p>You are concentrating on <b>'+esc(P[S.conc].n)+'</b> and took damage. Roll a Constitution saving throw (+2). You need <b>'+dc+'</b> or more to keep it.</p><div id="ccres"></div>'+
   '<div class="acts"><button class="btn alt" data-a="close">Close</button><button class="btn" data-a="ccroll" data-v="'+dc+'">Roll Constitution save</button></div></div>');
}

/* =========================================================
   CASTING
   ========================================================= */
var ctx=null;
function options(sp){
  var o=[];
  if(sp.kind==='none') o.push({k:'none',label:sp.isFeature?'No cost':'Cantrip: no cost',sub:'Unlimited'});
  if(sp.kind==='bi') o.push({k:'bi',label:'Spend 1 Bardic Inspiration use',sub:S.bi+' of 3 left',dis:S.bi<1,lvl:0});
  if(sp.kind==='free'){
    o.push({k:'free',label:'Free cast (once per Long Rest)',sub:S.free[sp.fid]?'Available':'Already used',dis:!S.free[sp.fid],lvl:sp.lvl});
  }
  if(sp.kind==='slot'||sp.kind==='free'){
    if(sp.ritual) o.push({k:'ritual',label:'Cast as a ritual',sub:'No slot, but it takes 10 extra minutes. Not for use in a fight.',lvl:sp.lvl});
    for(var l=sp.lvl;l<=2;l++){
      o.push({k:'s'+l,label:ordinal(l)+'-level slot'+(l>sp.lvl?' (stronger)':''),sub:S.slots[l]+' of '+(l===1?4:2)+' left'+(l>sp.lvl&&sp.up?'. '+sp.up:''),dis:S.slots[l]<1,lvl:l});
    }
  }
  return o;
}
function openCast(id){
  var sp=P[id]; ctx={id:id,opt:null,done:false};
  var os=options(sp), pick=null;
  if(sp.ritual && !S.combat){ pick=os.filter(function(x){return x.k==='ritual';})[0]; }
  if(!pick) pick=os.filter(function(x){return !x.dis;})[0];
  ctx.opt = pick? pick.k : null;
  drawCast();
}
function warnings(sp, opt){
  var w=[], t=S.turn;
  if(S.silenced && sp.V) w.push(['','You are inside a Silence zone. '+sp.n+' needs your voice, so it will not work until you step out.',true]);
  if(opt && opt.k!=='ritual' && S.combat){
    if(sp.time==='Action' && t.action) w.push(['','You already used your Action this turn.']);
    if(sp.time==='Bonus Action' && t.bonus) w.push(['','You already used your Bonus Action this turn.']);
    if(sp.time==='Reaction' && t.reaction) w.push(['','You already used your Reaction this round.']);
    if(sp.time==='Bonus Action' && sp.lvl>0 && t.leveledAction) w.push(['','Rule: you cast a leveled spell with your Action this turn, so you cannot also cast a spell with a Bonus Action.']);
    if(sp.time==='Action' && sp.lvl>0 && t.bonusSpell) w.push(['','Rule: you cast a spell with your Bonus Action this turn, so only a cantrip is allowed with your Action.']);
  }
  if(sp.conc && S.conc && S.conc!==sp.id && !(opt&&opt.k==='ritual'&&false)) w.push(['info','This ends your Concentration on '+P[S.conc].n+'.']);
  if(sp.conc && S.conc===sp.id) w.push(['info','You are already concentrating on this. Casting it again just restarts it.']);
  return w;
}
function drawCast(){
  var sp=P[ctx.id], os=options(sp), cur=os.filter(function(x){return x.k===ctx.opt;})[0];
  var h='<div class="dlg"><h2 id="dlgt">'+sp.n+'</h2><p class="muted" style="margin-bottom:4px">'+sp.one+'</p>';
  if(!ctx.done){
    h+='<fieldset style="border:0;padding:0;margin:8px 0 0"><legend class="sr">What to spend</legend>'+os.map(function(x){
      return '<label class="opt'+(x.dis?' dis':'')+'"><input type="radio" name="cost" value="'+x.k+'"'+(x.k===ctx.opt?' checked':'')+(x.dis?' disabled':'')+'><span><b>'+x.label+'</b><span>'+x.sub+'</span></span></label>';
    }).join('')+'</fieldset>';
    var ws=warnings(sp,cur);
    h+=ws.map(function(w){return '<div class="alert'+(w[0]==='info'?' info':'')+'">'+w[1]+'</div>';}).join('');
    var blocked = S.silenced && sp.V;
    h+='<div class="acts"><button class="btn alt" data-a="close">Cancel</button><button class="btn" data-a="castgo"'+((!cur||blocked)?' disabled':'')+'>Cast '+sp.n+'</button></div>';
  } else {
    h+='<div class="alert info" style="border-left-color:var(--sage);background:rgba(140,194,168,.12)"><b>Done.</b> '+ctx.summary+'</div><h3 style="font-size:19px;margin-top:12px">Now at the table</h3><ol class="steps-s">'+sp.how.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ol>';
    if(sp.roll){
      var r=sp.roll(ctx.level||sp.lvl||1);
      h+='<div class="result" style="min-height:0;margin:14px 0 0" id="castres"><div class="why">'+r.what+'</div><div class="row" style="margin-top:6px"><button class="btn sm" data-a="castroll" data-v="'+r.expr+'" data-w="'+esc(r.what)+'">Roll '+r.expr.replace('+',' + ')+'</button></div></div>';
    }
    h+='<div class="acts"><button class="btn" data-a="close">Close</button></div>';
  }
  openDialog(h+'</div>');
}
function castGo(){
  var sp=P[ctx.id], os=options(sp), cur=os.filter(function(x){return x.k===ctx.opt;})[0];
  if(!cur||cur.dis) return;
  var t=S.turn, lvl=cur.lvl!=null?cur.lvl:sp.lvl, sum='';
  if(cur.k==='s1'){S.slots[1]--; sum='Used a 1st-level slot.';}
  else if(cur.k==='s2'){S.slots[2]--; sum='Used a 2nd-level slot.';}
  else if(cur.k==='free'){S.free[sp.fid]=false; sum='Used your free cast. It returns after a Long Rest.';}
  else if(cur.k==='bi'){S.bi--; sum='Spent a Bardic Inspiration use ('+S.bi+' left).';}
  else if(cur.k==='ritual'){sum='Cast as a ritual: no slot used. It takes 10 extra minutes.';}
  else sum='No cost.';
  if(S.combat && cur.k!=='ritual'){
    if(sp.time==='Action') { t.action=true; if(sp.lvl>0) t.leveledAction=true; }
    if(sp.time==='Bonus Action'){ t.bonus=true; if(sp.lvl>0) t.bonusSpell=true; }
    if(sp.time==='Reaction') t.reaction=true;
    sum+=' Your '+(sp.time==='Bonus Action'?'Bonus Action':sp.time)+' is marked as spent.';
  }
  if(sp.conc){ var prev=S.conc && S.conc!==sp.id ? P[S.conc].n : null; S.conc=sp.id; if(prev) sum+=' Concentration on '+prev+' ended.'; else sum+=' You are now concentrating.'; }
  ctx.done=true; ctx.summary=sum; ctx.level=lvl||sp.lvl;
  pushLog('Cast '+sp.n, cur.k==='ritual'?'ritual':cur.k==='none'?'cantrip':cur.k, '');
  save(); render(true); drawCast();
}

/* =========================================================
   RESTS
   ========================================================= */
function confirmDlg(title,body,action,label){
  openDialog('<div class="dlg"><h2 id="dlgt">'+title+'</h2><p>'+body+'</p><div class="acts"><button class="btn alt" data-a="close">Cancel</button><button class="btn" data-a="'+action+'">'+label+'</button></div></div>');
}
function longRest(){
  S.hp=MAXHP; S.temp=0; S.slots={1:4,2:2}; S.bi=3; S.free={longstrider:true,disguiseSelf:true}; S.conc=null; S.death={s:0,f:0};
  S.hd=Math.min(HITDICE,S.hd+Math.max(1,Math.floor(HITDICE/2)));
  S.turn=fresh().turn; S.combat=false; S.round=1; S.silenced=false;
  save(); closeDialog(); render(true); toast('Long Rest done. Everything is back.');
}
function shortRestDlg(){
  var h='<div class="dlg"><h2 id="dlgt">Short Rest</h2><p>An hour of rest. Spend Hit Dice to heal: each one heals a d8 plus 2. Your spell slots do not come back.</p>'+
   '<p>Hit Dice left: <b>'+S.hd+'</b>. Hit points: <b>'+S.hp+' / '+MAXHP+'</b>.</p><div id="srres"></div>'+
   '<div class="acts"><button class="btn alt" data-a="close">Done</button><button class="btn" data-a="spendhd"'+((S.hd<1||S.hp>=MAXHP)?' disabled':'')+'>Spend a Hit Die</button></div></div>';
  openDialog(h);
}

/* =========================================================
   EVENTS
   ========================================================= */
document.addEventListener('click', function(e){
  var b=e.target.closest('[data-a]'); if(!b) return;
  var a=b.dataset.a, v=b.dataset.v;
  switch(a){
   case 'tab': go(v); break;
   case 'hideintro': S.seenIntro=true; save(); render(true); break;
   case 'hp': openHP(); break;
   case 'close': closeDialog(); break;
   case 'pip': {
     var k=b.dataset.k, i=+b.dataset.i;
     if(k==='s1') S.slots[1]= Math.max(0,Math.min(4,S.slots[1]+(i<S.slots[1]?-1:1)));
     else if(k==='s2') S.slots[2]= Math.max(0,Math.min(2,S.slots[2]+(i<S.slots[2]?-1:1)));
     else if(k==='bi') S.bi= Math.max(0,Math.min(3,S.bi+(i<S.bi?-1:1)));
     else if(k.indexOf('f:')===0){ var id=k.slice(2); S.free[id]=!S.free[id]; }
     save(); render(true); break; }
   case 'endconc': S.conc=null; save(); render(true); toast('Concentration ended.'); break;
   case 'silence': S.silenced=!S.silenced; save(); render(true); break;
   case 'beat': S.turn[v]=!S.turn[v]; save(); render(true); break;
   case 'newturn': S.turn=fresh().turn; if(S.combat) S.round++; save(); render(true); toast('New turn. All beats are ready.'); break;
   case 'combat': S.combat=!S.combat; if(S.combat){S.round=1;} S.turn=fresh().turn; save(); render(true); break;
   case 'intent': S.intent=v; save(); render(true); break;
   case 'filter': S.filter=v; save(); render(true); break;
   case 'use': openCast(v); break;
   case 'castgo': castGo(); break;
   case 'castroll': {
     var r=rollExpr(v); if(!r) break;
     var el=$('castres'); el.innerHTML='<div class="why">'+esc(b.dataset.w)+'</div><div class="big" style="font-size:44px">'+r.total+'</div><div class="why">'+r.parts.join(' + ')+(r.bonus?' '+fm(r.bonus):'')+' = '+r.total+'</div>';
     pushLog('Spell roll '+v, r.parts.join('+'), r.total); save(); break; }
   case 'adv': S.adv=v; save(); render(true); break;
   case 'rollinit': doCheck('Initiative', INIT, 'Highest total goes first.'); break;
   case 'rollskill': { var s=skillById(v); doCheck(s.n, skillBonus(s)); break; }
   case 'rollsave': { var sv=SAVES.filter(function(x){return x.id===v;})[0]; doCheck(sv.n+' save', saveBonus(sv)); break; }
   case 'attack': doAttack(v); break;
   case 'dmg': doDamage(v, b.dataset.c==='1'); break;
   case 'die': { var n=+v, r2=rnd(n); showRoll({label:'d'+n,total:r2,detail:'One d'+n,crit:null}); break; }
   case 'hpapply': applyHP(v); break;
   case 'ccroll': {
     var dc=+v, rr=rnd(20), tot=rr+ABIL.con;
     var ok = tot>=dc;
     if(!ok){ S.conc=null; }
     save(); $('ccres').innerHTML='<div class="alert'+(ok?' info':'')+'"><b>'+rr+' '+fm(ABIL.con)+' = '+tot+'.</b> '+(ok?'You keep your concentration.':'You lose your concentration.')+'</div>';
     b.disabled=true; render(true); break; }
   case 'deathroll': {
     var dr=rnd(20), msg;
     if(dr===20){ S.hp=1; S.death={s:0,f:0}; msg='Natural 20. You get back up with 1 hit point.'; }
     else if(dr===1){ S.death.f=Math.min(3,S.death.f+2); msg='Natural 1. Two failures.'; }
     else if(dr>=10){ S.death.s++; msg=dr+': a success.'; }
     else { S.death.f++; msg=dr+': a failure.'; }
     if(S.death.s>=3){ msg+=' Three successes: you are stable.'; }
     if(S.death.f>=3){ msg+=' Three failures. Tell your DM.'; }
     save(); render(true); toast(msg); openHP(); break; }
   case 'deathfail': S.death.f=Math.min(3,S.death.f+1); save(); render(true); openHP(); break;
   case 'longrest': confirmDlg('Long Rest','This restores all hit points, spell slots, Bardic Inspiration and free casts, and ends your Concentration.','dolong','Take a Long Rest'); break;
   case 'dolong': longRest(); break;
   case 'shortrest': shortRestDlg(); break;
   case 'spendhd': {
     if(S.hd<1||S.hp>=MAXHP) break;
     var h1=rnd(8), heal=h1+ABIL.con; S.hd--; S.hp=Math.min(MAXHP,S.hp+heal); save(); render(true);
     shortRestDlg(); $('srres').innerHTML='<div class="alert info">Rolled '+h1+' + 2: healed '+heal+'.</div>'; break; }
   case 'days': S.days=Math.max(0,S.days+(+v)); save(); render(true); break;
   case 'reset': confirmDlg('Reset everything','This clears hit points, slots, notes and rolls on this device and starts fresh.','doreset','Reset'); break;
   case 'doreset': S=fresh(); try{localStorage.removeItem(KEY);}catch(x){} closeDialog(); render(false); toast('Reset.'); break;
  }
});
document.addEventListener('change', function(e){
  if(e.target.name==='cost' && ctx){ ctx.opt=e.target.value; drawCast(); var chk=dlg.querySelector('input[name=cost]:checked'); if(chk) chk.focus(); }
});
document.addEventListener('input', function(e){
  if(e.target.id==='notes'){ S.notes=e.target.value; save(); }
  if(e.target.id==='gq'){ $('gloss').innerHTML=glossHtml(e.target.value); }
});
dlg.addEventListener('click', function(e){ if(e.target===dlg) closeDialog(); });

render(false);
if('IntersectionObserver' in window){ new IntersectionObserver(function(en){ $('mini').classList.toggle('on', !en[0].isIntersecting); },{threshold:0}).observe(document.querySelector('.status')); }
})();
</script>
