  function load(i) {
    cur = (i + TRACKS.length) % TRACKS.length;
    const k = TRACKS[cur], v = k.v, bpm = trackBpm(k);
    A.hold = true;
    A.style = v;
    A.setBpm(bpm);
    t0 = performance.now();
    dur = PHRASES * 32 * 60 / bpm * 1000;
    paint();
  }
  function play(i) {
    if (!A.ensure()) return;           /* synchronous inside the click handler (WebKit) */
    EM.settings.mute = false; playing = true;
    if (i !== undefined && i !== cur) load(i); else if (cur < 0) load(0);
    A.vol = $('vol').value / 100; A.applyMute();
    paint();
  }
  function pause() { playing = false; EM.settings.mute = true; A.applyMute(); paint(); }

  function paint() {
    const pl = $('b-play');
    pl.textContent = tr(playing ? 'pause' : 'play');
    $('b-prev').textContent = tr('prev'); $('b-next').textContent = tr('next');
    const ab = $('b-auto'); ab.textContent = tr(auto ? 'auto' : 'autoOff'); ab.setAttribute('aria-pressed', String(auto));
    $('l-vol').textContent = tr('vol'); $('sub').textContent = tr('sub'); $('note').textContent = tr('note'); $('back').textContent = tr('back');
    $('back').href = '/games/excuse-me/' + (EM.lang === 'en' ? '' : '?lang=' + EM.lang);
    $('nt').textContent = cur < 0 ? tr('idle') : (String(cur + 1).padStart(2, '0') + '  ' + EM.tr(TRACKS[cur].n));
    $('nm').textContent = cur < 0 ? '' : EM.tr(TRACKS[cur].room) + '  //  ' + trackBpm(TRACKS[cur]) + ' ' + tr('bpm') + (playing ? '' : '  //  ' + tr('paused'));
    $('nd').textContent = cur < 0 ? '' : EM.tr(TRACKS[cur].note);
    document.title = (cur < 0 ? '' : EM.tr(TRACKS[cur].n) + ' — ') + 'EXCUSE ME — Soundtrack by ÆRIEL';
    document.querySelectorAll('#lang button').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.l === EM.lang)); });
    const had = document.activeElement && document.activeElement.classList.contains('tr') ? Array.prototype.indexOf.call(document.querySelectorAll('#list .tr'), document.activeElement) : -1;
    $('list').innerHTML = '';
    TRACKS.forEach(function (k, i) {
      const li = document.createElement('li'), b = document.createElement('button');
      b.type = 'button'; b.className = 'tr';
      if (i === cur) b.setAttribute('aria-current', 'true');
      b.innerHTML = '<span class="n"></span><span class="info"><span class="x"></span><span class="rm"></span></span><span class="b"></span>';
      b.children[0].textContent = String(i + 1).padStart(2, '0');
      b.children[1].children[0].textContent = EM.tr(k.n);
      b.children[1].children[1].textContent = EM.tr(k.room);
      b.children[2].textContent = trackBpm(k) + ' ' + tr('bpm');
      b.addEventListener('click', function () { play(i); });
      li.appendChild(b); $('list').appendChild(li);
      if (i === had) b.focus();
    });
  }

  $('b-play').addEventListener('click', function () { if (playing) pause(); else play(); });
  $('b-prev').addEventListener('click', function () { play(cur < 0 ? TRACKS.length - 1 : cur - 1); });
  $('b-next').addEventListener('click', function () { play(cur + 1); });
  $('b-auto').addEventListener('click', function () { auto = !auto; paint(); });
  $('vol').addEventListener('input', function () { A.vol = this.value / 100; if (A.ctx) A.applyMute(); });
  $('lang').addEventListener('click', function (e) {
    const l = e.target && e.target.dataset && e.target.dataset.l; if (!l) return;
    EM.setLang(l); try { localStorage.setItem('preferred-lang', l); } catch (x) { /* ignore */ }
    $('back').href = '/games/excuse-me/' + (l === 'en' ? '' : '?lang=' + l);
  });
  EM.onLang = function () { paint(); };

  setInterval(function () {
    if (!playing || cur < 0) return;
    const f = Math.min(1, (performance.now() - t0) / dur);
    $('pgi').style.width = (f * 100).toFixed(1) + '%'; $('pg').setAttribute('aria-valuenow', Math.round(f * 100));
    if (f >= 1) { if (auto) { load(cur + 1); } else { t0 = performance.now(); } }
  }, 250);

  EM.lang = EM.detectLang(); document.documentElement.lang = EM.lang;
  paint();
})();
</script>
</body>
</html>
