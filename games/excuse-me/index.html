<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EXCUSE ME — 8-bit Night Out RPG by ÆRIEL</title>
  <meta name="description" content="One night at club LA GRIETA. Cross the crowd with your friends, say excuse me, dance, and make it to sunrise. 8-bit RPG by ÆRIEL. 18+.">
  <meta name="author" content="ÆRIEL">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="ÆRIEL">
  <meta property="og:title" content="EXCUSE ME — 8-bit Night Out RPG by ÆRIEL">
  <meta property="og:description" content="One night at club LA GRIETA. Cross the crowd with your friends, say excuse me, dance, and make it to sunrise. 18+.">
  <meta property="og:url" content="https://aeriel.net/games/excuse-me/">
  <meta property="og:image" content="https://aeriel.net/og-image.jpg">
  <meta property="og:image:width" content="1024">
  <meta property="og:image:height" content="1024">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="EXCUSE ME — 8-bit Night Out RPG by ÆRIEL">
  <meta name="twitter:description" content="One night at club LA GRIETA. Cross the crowd with your friends, say excuse me, dance, and make it to sunrise. 18+.">
  <meta name="twitter:image" content="https://aeriel.net/og-image.jpg">
  <link rel="canonical" href="https://aeriel.net/games/excuse-me/">
  <link rel="alternate" hreflang="es" href="https://aeriel.net/juegos/excuse-me">
  <link rel="alternate" hreflang="pt" href="https://aeriel.net/jogos/excuse-me">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%230A0A0A'/><text y='70' x='50' font-size='65' text-anchor='middle' fill='%23FFFFFF' font-family='monospace' font-weight='bold'>Æ</text></svg>">
  <link rel="stylesheet" href="excuse.css?v=1">
</head>
<body>
<div id="app">

  <!-- TITLE -->
  <section id="screen-title" class="screen">
    <p class="kicker">[ ÆRIEL // GAMES ]</p>
    <a id="t-home" class="homelink" href="/games?game=excuse-me" hidden></a>
    <h1 class="logo">EXCUSE ME</h1>
    <p id="t-sub" class="sub"></p>
    <p id="t-tag" class="tag"></p>
    <div class="row">
      <button id="btn-new" class="primary" type="button"></button>
      <button id="btn-cont" type="button" hidden></button>
    </div>
    <div class="lang">
      <button class="langbtn" data-l="en" type="button">EN</button>
      <button class="langbtn" data-l="es" type="button">ES</button>
      <button class="langbtn" data-l="pt" type="button">PT</button>
    </div>
    <div class="how">
      <h2 id="t-how-h"></h2>
      <p id="t-how1"></p>
      <p id="t-how2"></p>
      <p id="t-how3"></p>
    </div>
    <p id="t-notice" class="notice"></p>
  </section>

  <!-- CHARACTER CREATOR -->
  <section id="screen-creator" class="screen" hidden>
    <h2 id="c-title"></h2>
    <div class="creator">
      <div class="preview"><canvas id="c-preview" width="144" height="272"></canvas></div>
      <div class="fields">
        <label id="c-name-l" for="c-name"></label>
        <input id="c-name" type="text" maxlength="12" autocomplete="off" autocapitalize="characters" enterkeyhint="done" spellcheck="false">
        <span id="c-gender-l" class="label"></span>
        <div id="c-gender" class="segs"></div>
        <p id="c-gnote" class="note"></p>
        <div id="c-rows"></div>
      </div>
    </div>
    <div class="row">
      <button id="c-back" type="button"></button>
      <button id="c-rand" type="button"></button>
      <button id="c-go" class="primary" type="button"></button>
    </div>
  </section>

  <!-- GAME -->
  <section id="screen-game" class="screen game" hidden>
    <div id="hud">
      <div class="hud-top">
        <span id="hud-clock" class="clock">22:00</span>
        <span id="hud-place" class="place"></span>
        <span id="hud-fx" class="fxline"></span>
        <span class="hud-btns">
          <span id="hud-water" class="water" data-aria="water" title="Water bottles"></span>
          <button id="btn-mute" type="button"></button>
          <button id="btn-menu" type="button"></button>
        </span>
      </div>
      <div class="bars">
        <div id="bar-fun" class="bar"><span class="lab"></span><span class="track"><span class="fill"></span></span><span class="num"></span></div>
        <div id="bar-soc" class="bar"><span class="lab"></span><span class="track"><span class="fill"></span></span><span class="num"></span></div>
        <div id="bar-hp" class="bar"><span class="lab"></span><span class="track"><span class="fill"></span></span><span class="num"></span></div>
        <div id="bar-weird" class="bar"><span class="lab"></span><span class="track"><span class="fill"></span></span><span class="num"></span></div>
      </div>
    </div>

    <div id="stage">
      <canvas id="screen" data-aria="screen" aria-label="Game view" role="img"></canvas>
      <div id="toasts" aria-live="polite"></div>
      <div id="menu" hidden>
        <div id="menu-tabs">
          <button type="button" data-tab="status"></button>
          <button type="button" data-tab="quests"></button>
          <button type="button" data-tab="settings"></button>
          <button id="menu-close" type="button">X</button>
        </div>
        <div id="menu-body"></div>
      </div>
    </div>

    <div id="panel">
      <div id="hint"><span id="hint-obj"></span><span id="hint-prompt"></span></div>
      <div id="dialog" hidden>
        <div class="who"><canvas id="portrait" width="54" height="60"></canvas><div><strong id="dlg-name"></strong><span id="dlg-role"></span></div></div>
        <div id="dlg-text"></div>
        <div id="dlg-choices"></div>
      </div>
    </div>

    <div class="pad" data-aria="pad" aria-label="Touch controls">
      <div class="dpad">
        <button type="button" data-k="up" data-aria="up" aria-label="Up">▲</button>
        <button type="button" data-k="left" data-aria="left" aria-label="Left">◀</button>
        <button type="button" data-k="right" data-aria="right" aria-label="Right">▶</button>
        <button type="button" data-k="down" data-aria="down" aria-label="Down">▼</button>
      </div>
      <div class="ab">
        <button type="button" data-k="b" data-aria="back" aria-label="Back">X</button>
        <button type="button" data-k="a" data-aria="action" aria-label="Action">Z</button>
      </div>
    </div>
  </section>

  <!-- ENDING -->
  <section id="screen-ending" class="screen" hidden>
    <p id="e-kicker" class="kicker"></p>
    <h1 id="e-title" class="etitle"></h1>
    <canvas id="e-art" width="160" height="90"></canvas>
    <div id="e-text" class="etext"></div>
    <h2 id="e-rep-h"></h2>
    <div class="report">
      <div id="e-friends"></div>
      <div id="e-moments"></div>
      <div id="e-bars"></div>
    </div>
    <p id="e-night" class="note"></p>
    <div class="row"><button id="e-again" class="primary" type="button"></button><button id="e-title-btn" type="button" hidden></button></div>
  </section>

</div>
<script src="core.js"></script>
<script src="sprites.js"></script>
<script src="audio.js"></script>
<script src="world.js"></script>
<script src="logic.js"></script>
<script src="engine.js"></script>
<script src="ui.js"></script>
<script src="rhythm.js"></script>
<script src="story_a.js"></script>
<script src="story_main.js"></script>
<script src="story_friends.js"></script>
<script src="story_b.js"></script>
<script src="story_c.js"></script>
<script src="story_d.js"></script>
<script src="story_e.js"></script>
<script src="story_extra.js"></script>
<script src="endings.js"></script>
<script src="story_v3.js"></script>
<script src="screens.js"></script>
</body>
</html>
